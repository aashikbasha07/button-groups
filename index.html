<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 4 Button Groups Examples</title>

  <!-- Bootstrap 4 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >
</head>
<body>

<div class="container my-5">
  <h1 class="text-center">Bootstrap 4 Button Groups – All Examples</h1>

  <!-- Basic Button Group -->
  <section class="mt-5">
    <h3>1. Basic Button Group</h3>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-primary">Apple</button>
      <button type="button" class="btn btn-primary">Samsung</button>
      <button type="button" class="btn btn-primary">Sony</button>
    </div>
  </section>

  <!-- Sized Button Groups -->
  <section class="mt-5">
    <h3>2. Sized Button Groups</h3>

    <p><strong>Large:</strong></p>
    <div class="btn-group btn-group-lg" role="group">
      <button type="button" class="btn btn-primary">Apple</button>
      <button type="button" class="btn btn-primary">Samsung</button>
      <button type="button" class="btn btn-primary">Sony</button>
    </div>

    <p class="mt-3"><strong>Default:</strong></p>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-secondary">Apple</button>
      <button type="button" class="btn btn-secondary">Samsung</button>
      <button type="button" class="btn btn-secondary">Sony</button>
    </div>

    <p class="mt-3"><strong>Small:</strong></p>
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-success">Apple</button>
      <button type="button" class="btn btn-success">Samsung</button>
      <button type="button" class="btn btn-success">Sony</button>
    </div>
  </section>

  <!-- Vertical Button Group -->
  <section class="mt-5">
    <h3>3. Vertical Button Group</h3>
    <div class="btn-group-vertical" role="group">
      <button type="button" class="btn btn-info">Apple</button>
      <button type="button" class="btn btn-info">Samsung</button>
      <button type="button" class="btn btn-info">Sony</button>
    </div>
  </section>

  <!-- Nested Button Group with Dropdown -->
  <section class="mt-5">
    <h3>4. Nested Button Group with Dropdown</h3>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-warning">Apple</button>
      <button type="button" class="btn btn-warning">Samsung</button>

      <div class="btn-group" role="group">
        <button
          id="btnGroupDrop1"
          type="button"
          class="btn btn-warning dropdown-toggle"
          data-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="false"
        >
          Sony
        </button>
        <div class="dropdown-menu" aria-labelledby="btnGroupDrop1">
          <a class="dropdown-item" href="#">Tablet</a>
          <a class="dropdown-item" href="#">Smartphone</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Split Button Dropdown -->
  <section class="mt-5">
    <h3>5. Split Button Dropdown</h3>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-danger">Sony</button>
      <button
        type="button"
        class="btn btn-danger dropdown-toggle dropdown-toggle-split"
        data-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span class="sr-only">Toggle Dropdown</span>
      </button>
      <div class="dropdown-menu">
        <a class="dropdown-item" href="#">Tablet</a>
        <a class="dropdown-item" href="#">Smartphone</a>
      </div>
    </div>
  </section>

  <!-- Side by Side Button Groups -->
  <section class="mt-5">
    <h3>6. Multiple Button Groups Side by Side</h3>
    <div class="btn-group mr-2" role="group">
      <button type="button" class="btn btn-success">BMW</button>
      <button type="button" class="btn btn-success">Mercedes</button>
      <button type="button" class="btn btn-success">Volvo</button>
    </div>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-secondary">Audi</button>
      <button type="button" class="btn btn-secondary">Tesla</button>
      <button type="button" class="btn btn-secondary">KIA</button>
    </div>
  </section>

</div>

<!-- Bootstrap 4 JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
